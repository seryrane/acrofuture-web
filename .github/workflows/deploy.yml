# 홈페이지를 GitHub Pages 로 내보낸다.
#
# 왜 산출물(site/out)을 저장소에 커밋하지 않고 여기서 굽는가:
#   빌드 결과를 커밋하면 "고쳤는데 배포는 옛 화면"이 반드시 생긴다(누가 빌드를 잊는다).
#   콘텐츠 정본(src/content)만 고치면 여기서 다시 구워 올리도록 한 곳으로 몰아 둔다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 손으로도 돌릴 수 있게 (콘텐츠는 그대로인데 다시 굽고 싶을 때)

# Pages 배포에 필요한 최소 권한만 준다
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 된다 — 나중 것이 이긴다. 단 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # ⚠ npm ci 는 package-lock.json 을 그대로 따른다(npm install 과 달리 버전을 안 올린다).
      #   로컬에서 되는 빌드가 여기서만 깨지는 일을 막는다.
      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5

      # next.config.ts 의 output:'export' 가 site/out 에 통짜 정적 파일을 남긴다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
